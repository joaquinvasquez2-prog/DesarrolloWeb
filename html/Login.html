<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Login</title>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/login.css">
    </head>
    <body class="Login">
        <h1 class ="TituloPrincipal">
            Bienvenido a MarketOps
        </h1>
        <form action="" id="formLogin">
            <h2>
            Iniciar Sesion
            </h2>
            <div>
            <label for="usuario"> Usuario</label>
            <input type="text" id="usuario" name="Usuario">
            </div>
            <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">
            </div>
            <button type="submit">Ingresar</button>
        </form>
        </div>
        <div>
            <a href="encargado/Encargado_Inicio.html" class="boton-demo">Ingresar como Encargado</a>
            <a href="tecnico/Tecnico_inicio.html" class="boton-demo">Ingresar como Tecnico</a>
            <a href="administrador/Admin_Inicio.html" class="boton-demo">Ingresar como Admin</a>
        </div>

            <script>
                document.getElementById("formLogin").addEventListener("submit", function(evento) {
                const usuario = document.getElementById("usuario").value.trim();
                const password = document.getElementById("password").value.trim();
                if (usuario === "" || password === "") 
                {
                evento.preventDefault();
                alert("Complete todos los campos para poder continuar");                          
                }
                });
            </script>
    </body>

</html>
