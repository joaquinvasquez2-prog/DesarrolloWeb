<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Login</title>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/login.css">
        <link rel="manifest" href="../manifest.json">
    </head>
    <body class="Login">
        <h1 class ="TituloPrincipal">
            Bienvenido a MarketOps
        </h1>
        <form id="formLogin" x-data="
        {
            usuario: '',
            password:  '',
            error: {
                usuario: '',
                password: '',
            },
            validarform()
            {
                this.error.usuario = '';
                this.error.password = '';
                if (this.usuario === '')
                {
                    this.error.usuario = 'Ingrese el usuario';
                }
                if (this.password === '')
                {
                    this.error.password = 'Ingrese el contraseña';
                }
            }
        }"
        @submit.prevent="validarform">
        <div>
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" x-model="usuario">
        </div>
        <div class="falta" x-show="error.usuario" x-text="error.usuario">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" x-model="password">
        </div>
        <div class="falta" x-show="error.password" x-text="error.password"></div>
        <button type="submit">Ingresar</button>
        </form>
        </div>
        <div>
            <a href="encargado/Encargado_Inicio.html" class="boton-demo">Ingresar como Encargado</a>
            <a href="tecnico/Tecnico_inicio.html" class="boton-demo">Ingresar como Tecnico</a>
            <a href="administrador/Admin_Inicio.html" class="boton-demo">Ingresar como Admin</a>
        </div>
    </body>
</html>
