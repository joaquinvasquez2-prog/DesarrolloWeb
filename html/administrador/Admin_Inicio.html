<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Admin Inicio</title>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/admin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
        <h2>MarketOps - Panel Administrador</h2>
        <a href="Admin_Inicio.html">Inicio</a>
        <a href="../Login.html">Cerrar Sesión</a>
        </header>
        <div class="TablaAdmin" x-data="{
            rolfiltro: '',
            sucursalfiltro: '',
            usuarios: [
                { nombre: 'Juan', usuario: 'juan01', rol: 'Administrador', sucursal: 'Puente Alto' },
                { nombre: 'Roberto', usuario: 'roberto01', rol: 'Tecnico', sucursal: 'La Florida' },
                { nombre: 'Benjamin', usuario: 'benjamin01', rol: 'Encargado', sucursal: 'Providencia' }
            ],
            get filtrados() {
                return this.usuarios.filter (i =>
                (this.rolfiltro === '' || i.rol === this.rolfiltro) &&
                (this.sucursalfiltro === '' || i.sucursal === this.sucursalfiltro)
                );
            }
        }">
        <div class ="filtros">
            <select x-model="rolfiltro">
                <option value="">Todos los roles</option>
                <option value="Administrador">Administrador</option>
                <option value="Tecnico">Tecnico</option>
                <option value="Encargado">Encargado</option>
            </select>
            <select x-model ="sucursalfiltro">
                <option value="">Todas las Sucursales</option>
                <option value="Puente Alto">Puente Alto</option>
                <option value="La Florida">La Florida</option>
                <option value="Providencia">Providencia</option>
            </select>
        </div>
        <table>
            <tr>
                <th>Sucursal</th>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th></th>
            </tr>
            <template x-for="i in filtrados">
                <tr>
                    <td x-text="i.sucursal"></td>
                    <td x-text="i.nombre"></td>
                    <td x-text="i.usuario"></td>
                    <td x-text="i.rol"></td>
                    <td><button type="button">Editar</button></td>
                    <td><button type="button">Eliminar</button></td>
                </tr>
            </template>
        </table>
        </div>

























        <div class="Creacion">
            <h2>Nuevo Usuario</h2>
            <form action="" id="formnuevo" x-data="{
                nombre: '', usuario: '', password: '', rol: '', sucursal: '',
                error: {
                    nombre: '',
                    usuario: '',
                    password: '',
                    rol: '',
                    sucursal: ''
                },
                validarform(){
                    this.error.nombre = '';
                    this.error.usuario = '';
                    this.error.password = '';
                    this.error.rol = '';
                    this.error.sucursal = '';
                    if(this.nombre === '')
                    {
                        this.error.nombre = 'Ingrese el nombre completo';
                    }
                    if(this.usuario === '')
                    {
                        this.error.usuario = 'Ingrese el nombre de usuario';
                    }
                    if(this.password === '')
                    {
                        this.error.password = 'Ingrese la contraseña';
                    }
                    if(this.rol === '')
                    {
                        this.error.rol = 'Ingrese el rol';
                    }
                    if(this.rol === '')
                    {
                        this.error.sucursal = 'Ingrese la sucursal';
                    }
                }
            }" @submit.prevent="validarform">
                <div>
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" x-model="nombre">
                    <div class="falta" x-show="error.nombre" x-text="error.nombre"></div>
                </div>
                <div>
                    <label for="usuario">Nombre de Usuario</label>
                    <input type="text" id="usuario" x-model="usuario">
                    <div class="falta" x-show="error.usuario" x-text="error.usuario"></div>
                </div>
                <div>
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" x-model="password">
                    <div class="falta" x-show="error.password" x-text="error.password"></div>
                </div>
                <div>
                    <label for="rol">Seleccionar Rol</label>
                    <select name="rol" id="rol" x-model="rol">
                        <option value="">Seleccionar</option>
                        <option value="Admin">Administrador</option>
                        <option value="Encargado">Encargado</option>
                        <option value="Tecnico">Tecnico</option>
                    </select>
                <div class="falta" x-show="error.rol" x-text="error.rol"></div>
                </div>
                <div>
                    <label for="sucursal">Sucursal</label>
                    <select name="sucursal" id="sucursal" x-model="sucursal">
                        <option value="">Seleccionar</option>
                        <option value="Puente Alto">Puente Alto</option>
                        <option value="La Florida">La Florida</option>
                        <option value="Providencia">Providencia</option>
                    </select>
                <div class="falta" x-show="error.sucursal" x-text="error.sucursal"></div>
                </div>
                <button type="submit">Registrar</button>
            </form>
        </div>








































        
        <div class="Creacion">
                <h2>Editar Usuario</h2>
                <form action="" id="formeditar">
                    <div>
                        <label for="editNombre">Nombre Completo</label>
                        <input type="text" id="editNombre">
                    </div>
                    <div>
                        <label for="editUsuario">Nombre de Usuario</label>
                        <input type="text" id="editUsuario">
                    </div>
                    <div>
                        <label for="editpassword">Nueva Contraseña (opcional) </label>
                        <input type="password" id="editpassword">
                    </div>
                    <div>
                        <label for="editrol">Rol</label>
                        <select id="editrol">
                            <option value="Administrador" selected>Administrador</option>
                            <option value="Encargado">Encargado</option>
                            <option value="Técnico">Técnico</option>
                        </select>
                    </div>
                    <div>
                        <label for="editsucursal">Sucursal</label>
                        <select id="editsucursal">
                            <option value="Puente Alto" selected>Puente Alto</option>
                            <option value="La Florida">La Florida</option>
                            <option value="Providencia">Providencia</option>
                        </select>
                    </div>
                    <button type="submit">Guardar cambios</button>
                </form>
            </div>
    </main>
    <script>
        const botonesEditar = document.querySelectorAll('td button[type="button"]');
        botonesEditar.forEach((boton) => {
        boton.addEventListener('click', () => {
        const fila = boton.closest('tr');
        const nombreUsuario = fila.children[1].textContent;
        confirm(`¿Editar al usuario ${nombreUsuario}?`);
        })  
    })
    </script>
    </body>
</html>
