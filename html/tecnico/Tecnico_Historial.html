<!DOCTYPE html> 
<html lang="es"> 
  <head>
    <title>Tecnico Historial</title> 
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/tecnico.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <header>
      <h2>MarketOps - Historial de incidencias</h2>
      <a href="Tecnico_inicio.html">Inicio</a>
      <a href="Tecnico_Sucursales.html">Sucursales</a>
      <a href="Tecnico_Historial.html">Historial de incidencias</a>
      <a href="../Login.html">Cerrar Sesion</a>
    </header>
    <main class="ContenidoPrincipal" x-data="{
      filtrosucursal: '',
      historial: [
      { id: 1, sucursal: 'Puente Alto', equipo: 'Impresora 01', fechareporte: '2026-10-20', fecharesolucion: '2026-10-21', descripcion: 'Agotamiento de tinta' },
      { id: 2, sucursal: 'Puente Alto', equipo: 'Impresora 02', fechareporte: '2026-10-25', fecharesolucion: '2026-10-26', descripcion: 'Papel atascado' },
      { id: 3, sucursal: 'Puente Alto', equipo: 'Impresora 01', fechareporte: '2026-10-30', fecharesolucion: null,         descripcion: 'Imprime en blanco' },
      { id: 4, sucursal: 'La Florida',  equipo: 'Balanza 01',   fechareporte: '2026-10-18', fecharesolucion: '2026-10-18', descripcion: 'Peso incorrecto' },
      { id: 5, sucursal: 'La Florida',  equipo: 'Balanza 01',   fechareporte: '2026-10-24', fecharesolucion: '2026-10-26', descripcion: 'No enciende' },
      { id: 6, sucursal: 'La Florida',  equipo: 'Balanza 01',   fechareporte: '2026-10-31', fecharesolucion: null,         descripcion: 'Pantalla rota' },
      { id: 7, sucursal: 'Providencia', equipo: 'Caja 01',      fechareporte: '2026-10-15', fecharesolucion: '2026-10-15', descripcion: 'Cajón no abre' },
      { id: 8, sucursal: 'Providencia', equipo: 'Caja 01',      fechareporte: '2026-10-22', fecharesolucion: '2026-10-24', descripcion: 'No procesa pagos' },
      { id: 9, sucursal: 'Providencia', equipo: 'Caja 01',      fechareporte: '2026-10-28', fecharesolucion: '2026-10-29', descripcion: 'No procesa pagos' }
      ],
      get nincidencias()
            {
                return this.filtrados.length;
            },
            get resueltas ()
            {
                return this.filtrados.filter(i => i.fecharesolucion !== null).length;
            },
            get pendientes ()
            {
                return this.filtrados.filter(i => i.fecharesolucion === null).length;
            },
            estado(i) {
                if (i.fecharesolucion === null)
                {
                    return 'Pendiente';
                }
                return 'Resuelta';
            },
            get filtrados() {
              return this.historial.filter(i =>
              this.filtrosucursal === '' || i.sucursal === this.filtrosucursal
            );
            }
    }">
    <h2>Historial de fallas por sucursal</h2>
    <label for="Sucursal">Seleccionar Sucursal</label>
    <select id="Sucursal" x-model="filtrosucursal">
      <option value="">Todas</option>
      <option value="Puente Alto">Puente Alto</option>
      <option value="La Florida">La Florida</option>
      <option value="Providencia">Providencia</option>
    </select>
    <h3>Total incidencias: <div x-text="nincidencias"></div></h3>
    <h3>Resueltas: <div x-text="resueltas"></div></h3>
    <h3>Pendientes: <div x-text="pendientes"></div></h3>
    <table>
    <thead>
      <tr>
        <th>Sucursal</th>
        <th>Equipo</th>
        <th>Incidencia</th>
        <th>Fecha Reporte</th>
        <th>Fecha Resolución</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="i in filtrados">
        <tr>
          <td x-text="i.sucursal"></td>
          <td x-text="i.equipo"></td>
          <td x-text="i.descripcion"></td>
          <td x-text="i.fechareporte"></td>
          <td x-text="i.fecharesolucion"></td>
          <td x-text="estado(i)"></td>
        </tr>
      </template>
    </tbody>
    </table>
    </main>
  </body>
</html>
