  <!DOCTYPE html>
  <html lang="es">
    <head>
      <title>Tecnico Sucursales</title>
      <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="../../css/tecnico.css">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
      <header>
        <h2>MarketOps - Sucursales</h2>
        <a href="Tecnico_inicio.html">Inicio</a>
        <a href="Tecnico_Sucursales.html">Sucursales</a>
        <a href="Tecnico_Historial.html">Historial de incidencias</a> 
        <a href="../Login.html">Cerrar Sesion</a> 
      </header> 
      <main class="ContenidoPrincipal" x-data="{
        sucursalseleccion: '',
        sucursales:[
        {id: 1, nombre: 'Puente Alto'},        
        {id: 2, nombre: 'Providencia'},
        {id: 3, nombre: 'La Florida'}        
        ],
        equipos: [
        { id: 1,  sucursal: 'Puente Alto', nombre: 'Caja 01',      tipo: 'Caja',      estado: 'Funcionando' },
        { id: 2,  sucursal: 'Puente Alto', nombre: 'Caja 02',      tipo: 'Caja',      estado: 'Fuera de servicio' },
        { id: 3,  sucursal: 'Puente Alto', nombre: 'Caja 03',      tipo: 'Caja',      estado: 'Funcionando' },
        { id: 4,  sucursal: 'Puente Alto', nombre: 'Impresora 01', tipo: 'Impresora', estado: 'Funcionando' },
        { id: 5,  sucursal: 'Puente Alto', nombre: 'Impresora 02', tipo: 'Impresora', estado: 'Funcionando' },
        { id: 6,  sucursal: 'Puente Alto', nombre: 'Impresora 03', tipo: 'Impresora', estado: 'Con falla' },
        { id: 7,  sucursal: 'Puente Alto', nombre: 'Balanza 01',   tipo: 'Balanza',   estado: 'Con falla' },
        { id: 8,  sucursal: 'Puente Alto', nombre: 'Balanza 02',   tipo: 'Balanza',   estado: 'Funcionando' },
        { id: 9,  sucursal: 'Puente Alto', nombre: 'Balanza 03',   tipo: 'Balanza',   estado: 'Funcionando' },
        { id: 10, sucursal: 'La Florida',  nombre: 'Caja 01',      tipo: 'Caja',      estado: 'Funcionando' },
        { id: 11, sucursal: 'La Florida',  nombre: 'Caja 02',      tipo: 'Caja',      estado: 'Con falla' },
        { id: 12, sucursal: 'La Florida',  nombre: 'Balanza 01',   tipo: 'Balanza',   estado: 'Funcionando' },
        { id: 13, sucursal: 'La Florida',  nombre: 'Impresora 01', tipo: 'Impresora', estado: 'Con falla' },
        { id: 14, sucursal: 'Providencia', nombre: 'Caja 01',      tipo: 'Caja',      estado: 'Funcionando' },
        { id: 15, sucursal: 'Providencia', nombre: 'Balanza 01',   tipo: 'Balanza',   estado: 'Funcionando' },
        { id: 16, sucursal: 'Providencia', nombre: 'Impresora 01', tipo: 'Impresora', estado: 'Funcionando' }
        ],
        get equipossucursal() {
          return this.equipos.filter(i => i.sucursal === this.sucursalseleccion);
        },
        incidencias(nombre) {
          return this.equipos.filter(i => i.sucursal === nombre && i.estado !== 'Funcionando').length;
        },
        gravedad(nombre){
          const n = this.incidencias(nombre);
          if (n == 0) return 'Normal';
          if (n <= 2) return 'Media';
          return 'Grave';
        }
      }">
      <h3>Sucursales</h3>
      <table>
        <thead>
          <tr>
            <th>Sucursal</th>
            <th>Equipos con incidencias</th>
            <th>Gravedad</th>
            <th>Ver equipo</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="y in sucursales">
            <tr>
              <td x-text="y.nombre"></td>
              <td x-text="incidencias(y.nombre)"></td>
              <td x-text="gravedad(y.nombre)"></td>
              <td><button type="button" @click="sucursalseleccion = y.nombre">Ver equipos</button></td>
            </tr>
          </template>
        </tbody>
      </table>
      <div x-show="sucursalseleccion !== ''">
        <h3>Equipos de <div x-text="sucursalseleccion"></div></h3>
        <table>
          <thead>
            <tr>
              <th>Equipo</th>
              <th>Tipo</th>
              <th>Estado</th>
              <th>Actualizar estado</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="z in equipossucursal">
            <tr>
              <td x-text="z.nombre"></td>
              <td x-text="z.tipo"></td>
              <td x-text="z.estado"></td>
              <td>
                <select x-model="z.estado">
                  <option>Funcionando</option>
                  <option>Con falla</option>
                  <option>Fuera de servicio</option>
                </select>
              </td>
            </tr>
            </template>
          </tbody>
        </table>
      </div>
      </main> 
    </body> 
  </html>
